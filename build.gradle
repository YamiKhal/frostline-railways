plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.frostline'
archivesBaseName = 'frostline_railways'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { frostline_railways { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { frostline_railways { source sourceSets.main } } }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }            // Create, Ponder, Flywheel
    maven { url = 'https://maven.ithundxr.dev/mirror' }      // Registrate
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.20'

    // Create is optional at runtime too: Frostline Rail's Create code is only reached behind a ModList check.
    compileOnly fg.deobf("com.simibubi.create:create-1.20.1:6.0.8-289:slim") { transitive = false }
    compileOnly fg.deobf("net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91") { transitive = false }
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.5") { transitive = false }
    compileOnly fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.3") { transitive = false }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'frostline_railways',
            'Specification-Vendor'    : 'frostline',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'frostline'
        ])
    }
}
